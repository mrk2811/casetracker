app = 'app-ujjdvsxl'
primary_region = 'ewr'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.health]
    port = 8000
    type = "http"
    interval = "30s"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
